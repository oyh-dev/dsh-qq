# Copy this file to your profile's cordis.patch.yml (or merge the entry)
# and replace every <...> placeholder with your own values.
- insert:
    - id: qq-bridge
      name: '@dsh-local/dsh-qq'
      config:
        wsUrl: 'ws://127.0.0.1:3001'
        token: '<onebot-token>'
        account: '<bot-uin>'
        dataDir: 'D:/dsh-qq-data'
        mediaDir: 'D:/dsh-qq-data/media'
        ownerUins: ['<owner-uin>']
        allowedGroups: []
        autoPair: true
        permissionWaitSec: 60
        approvalTimeoutSec: 300
        maxImages: 6
        maxVideoFrames: 24
        videoFps: 5
        memoryEnabled: true
        memoryDir: 'D:/dsh-qq-data/memory'
        memoryContextDays: 7
        memoryRetentionDays: 90
        chatLogEnabled: true
        chatLogDir: 'D:/dsh-qq-data/chats'
        mergeWindowMs: 3500
        mergeQuickMs: 1200
        maxMergeMs: 9000
        slowReply:
          enabled: false
          start: '12:00'
          end: '18:00'
          probability: 0.5
          minMinutes: 10
          maxMinutes: 90
        proactive:
          enabled: false
          target: '<owner-uin>'
          allowlist: ['<owner-uin>']
          dailyMin: 8
          dailyMax: 17
          gapMinMinutes: 60
          gapMaxMinutes: 180
          burstMin: 1
          burstMax: 1
          burstGapMinSeconds: 3
          burstGapMaxSeconds: 12
          checkIntervalMinutes: 3
          quietAfterMinutes: 3
          imageDir: 'D:/dsh-qq-data/proactive-images'
          imageProbability: 0.2
        sendGuard:
          ratePerMinute: 15
          ratePerChatPerMinute: 5
          minSendIntervalMs: 1500
          groupMinSendIntervalMs: 3000
          groupRatePerMinute: 3
          dedupWindowMs: 30000
          jitterMs: 800
          breakerFailures: 3
          breakerCooldownMs: 600000
          blockLinks: true
          blockPhones: true
        biliDaily:
          enabled: false
          totalMinutes: 60
          sampleSeconds: 40
          maxVideos: 6
          digestAt: '22:30'
          minGapMinutes: 60
          report: false
          review: true
          sources:
            - history-main
            - history-bot
            - hot
